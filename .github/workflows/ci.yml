name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            linker_setup: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends mold
            rustflags: "-C link-arg=-fuse-ld=mold"
          - os: macos-latest
            linker_setup: |
              echo "Using system linker on macOS"
            rustflags: ""
          - os: windows-latest
            linker_setup: |
              echo "Using lld"
            rustflags: "-C link-arg=-fuse-ld=lld"

    env:
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - uses: actions/checkout@v4

      # GPUI Kit 0.7.0 enables the gpui-pre X11 and Wayland backends on
      # Linux. Release and test builds need the same native libraries:
      #   - freetype-sys probes `freetype2`
      #   - xkbcommon links `xkbcommon` / `xkbcommon-x11`
      #   - wayland-client probes `wayland-client`
      # Fontconfig is dlopen'd (yeslogic-fontconfig-sys and zed-font-kit
      # both key off RUST_FONTCONFIG_DLOPEN). Without that variable the
      # build script runs pkg-config and fails, because the runner does
      # not ship fontconfig.pc. The runtime library is libfontconfig.so.1.
      # Vulkan (ash) is also dlopen'd, so its -dev package is not required.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfreetype6-dev \
            libwayland-dev \
            libfontconfig1 \
            pkg-config \
            cmake \
            clang
          echo "RUST_FONTCONFIG_DLOPEN=1" >> "$GITHUB_ENV"

      - name: Install faster linker
        if: matrix.linker_setup != ''
        shell: bash
        run: ${{ matrix.linker_setup }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Generate a small fixture
        run: cargo run --release --locked --bin gen_fixture -- fixtures 2000

      - name: Probe the fixture
        run: cargo run --release --locked --bin anvil -- --probe fixtures/large.csv

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
