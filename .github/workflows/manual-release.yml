name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (for example: v0.1.0)'
        required: true
        type: string
      draft:
        description: 'Create the GitHub Release as a draft'
        required: false
        default: true
        type: boolean

jobs:
  package:
    name: Package ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            artifact_name: macos-x86_64
            linker_setup: |
              echo "Using system linker on macOS"
            rustflags: ""
            archive_cmd: |
              mkdir -p dist
              cp target/release/anvil dist/anvil
              tar -czf dist/anvil-macos-x86_64.tar.gz -C dist anvil

          - os: macos-latest
            artifact_name: macos-aarch64
            linker_setup: |
              echo "Using system linker on macOS"
            rustflags: ""
            archive_cmd: |
              mkdir -p dist
              cp target/release/anvil dist/anvil
              tar -czf dist/anvil-macos-aarch64.tar.gz -C dist anvil

          - os: windows-latest
            artifact_name: windows-x86_64
            linker_setup: |
              echo "Using lld"
            rustflags: "-C link-arg=-fuse-ld=lld"
            archive_cmd: |
              New-Item -ItemType Directory -Force -Path dist | Out-Null
              Copy-Item target/release/anvil.exe dist/anvil.exe
              Compress-Archive -Path dist/anvil.exe -DestinationPath dist/anvil-windows-x86_64.zip -Force

    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install faster linker
        if: matrix.linker_setup != ''
        shell: bash
        run: ${{ matrix.linker_setup }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Package release artifact
        run: ${{ matrix.archive_cmd }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Anvil ${{ github.event.inputs.version }}
          draft: ${{ github.event.inputs.draft }}
          generate_release_notes: true
          files: |
            release-assets/macos-x86_64/*
            release-assets/macos-aarch64/*
            release-assets/windows-x86_64/*
