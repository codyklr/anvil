[package]
name = "anvil-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Anvil: high-performance CSV/data viewer for inspection work"
license = "MIT"

[lib]
name = "anvil_core"
path = "src/lib.rs"

[[bin]]
name = "anvil"
path = "src/main.rs"

[[bin]]
name = "gen_fixture"
path = "src/bin/gen_fixture.rs"

[dependencies]
# UI (used by the `anvil` binary)
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
rfd = { version = "0.17", default-features = false }

# Data access
memchr = "2"
memmap2 = "0.9"

# Archive
zip = { version = "2.4", default-features = false, features = ["deflate", "bzip2"] }

# Temp files for archive extraction
tempfile = "3"

# Errors
thiserror = "1"

# Clipboard (text-only; no image support)
arboard = { version = "3", default-features = false }
candle-core = { version = "0.11.0", optional = true }
candle-transformers = { version = "0.11.0", optional = true }
tokenizers = { version = "0.23.2", optional = true }
ureq = { version = "2", optional = true }
gliner-rs = { version = "=0.2.3", optional = true, default-features = false }
serde_json = { version = "1", optional = true }
gliner-tokenizers = { package = "tokenizers", version = "0.22", optional = true, default-features = false, features = ["fancy-regex"] }

# rfd's build script requires one Linux dialog backend to be selected, or
# it panics with "You need to choose at least one backend". The upstream
# default is `xdg-portal` (a pure-Rust backend that needs no extra system
# libraries), so select it explicitly on Linux while leaving macOS/Windows
# resolution untouched. The generic `rfd` entry in [dependencies] above
# still applies everywhere else.
#
# GPUI's Linux window backends are feature-gated. Without `x11` or
# `wayland`, `gpui::current_platform` always resolves to the headless
# client on Linux, so the release binary cannot open a window even when a
# display is available. The dev-only `test-support` feature already pulls
# both in for `cargo test`; mirror them for the release binary. The CI
# Linux packages already cover this feature set. macOS/Windows are
# unaffected because this table is Linux-only.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "x11", "wayland"] }

# GPUI's Windows application manifest is feature-gated too. Without
# `windows-manifest`, gpui's build script does not embed
# `resources/windows/gpui.manifest.xml`, so the release binary is not
# bound to common-controls v6 and fails to start with
# `STATUS_ENTRYPOINT_NOT_FOUND` (0xc0000139). `windows-manifest` is part
# of gpui's default feature set; select it explicitly for Windows, leaving
# macOS and Linux resolution untouched.
[target.'cfg(target_os = "windows")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "windows-manifest"] }

[dev-dependencies]
crc32fast = "1"
# Enable GPUI's headless test harness only for tests. `test-support`
# pulls in the deterministic executor and `TestAppContext`; it is a
# dev-only feature so release builds keep the minimal gpui surface.
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "test-support"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[features]
# Optional embedded natural-language model backend for the Ask bar.
# Off by default: enabling it compiles candle + tokenizers + ureq and
# lets the bar download one pinned model on first use. The default build
# has none of these crates.
nl-model = [
    "dep:candle-core",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:ureq",
]
# Native extraction backend. Takes precedence if both model features are enabled.
nl-gliner = ["dep:gliner-rs", "dep:candle-core", "dep:serde_json", "dep:ureq", "dep:gliner-tokenizers"]
